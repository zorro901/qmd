[package]
name = "qmd-tui"
version = "0.1.0"
edition = "2021"
description = "Terminal UI for qmd (SimpleNote-style two-pane note browser/editor)"
license = "MIT"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }

[profile.release]
opt-level = 3
lto = true
